services:
  db:
    image: postgres:16-alpine
    container_name: akira-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD is required in .env}
      POSTGRES_DB: akira
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akira"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akira-api
    environment:
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw_dev_pass@db:5432/akira
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_owner:app_owner_dev_pass@db:5432/akira
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
