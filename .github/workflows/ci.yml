name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: akira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy app/domain app/services

      - name: Setup test databases
        run: |
          python -c "import psycopg; conn = psycopg.connect('postgresql://postgres:postgrespassword@localhost:5432/postgres', autocommit=True); conn.execute('CREATE DATABASE akira_migration_test;')"

      - name: Run migrations on test database
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/akira_test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/akira_test
          APP_ENV: test
        run: alembic upgrade head

      - name: Run pytest test suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/akira_test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/akira_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/akira_test
          APP_ENV: test
        run: pytest -q --cov=app
